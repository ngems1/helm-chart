suite: migration job
templates:
  - migration-job.yaml
release:
  name: orders
  revision: 3
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: runs before upgrades with the same image (factor XII)
    set:
      migration.enabled: true
      migration.command: [./migrate, up]
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: orders-twelve-factor-app-migrate-3
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/stefanprodan/podinfo:6.7.1
      - equal:
          path: spec.template.spec.containers[0].command
          value: [./migrate, up]
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: migration

  - it: passes config inline (the ConfigMap may still hold the old values)
    set:
      migration.enabled: true
      migration.command: [./migrate]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LOG_LEVEL, value: info}
