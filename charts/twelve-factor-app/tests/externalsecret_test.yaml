suite: externalsecret
templates:
  - externalsecret.yaml
release:
  name: orders
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: maps remote keys to env var names
    set:
      externalSecrets.enabled: true
      externalSecrets.secretStoreRef.name: aws-secrets-manager
      externalSecrets.data:
        - secretKey: DATABASE_URL
          remoteKey: prod/orders/database
          property: url
      externalSecrets.dataFrom:
        - remoteKey: prod/orders/env
    asserts:
      - isKind:
          of: ExternalSecret
      - isAPIVersion:
          of: external-secrets.io/v1
      - equal:
          path: spec.secretStoreRef
          value: {name: aws-secrets-manager, kind: ClusterSecretStore}
      - equal:
          path: spec.target
          value: {name: orders-twelve-factor-app-secrets, creationPolicy: Owner}
      - equal:
          path: spec.data[0]
          value:
            secretKey: DATABASE_URL
            remoteRef: {key: prod/orders/database, property: url}
      - equal:
          path: spec.dataFrom[0].extract.key
          value: prod/orders/env

  - it: supports the older v1beta1 API
    set:
      externalSecrets.enabled: true
      externalSecrets.apiVersion: external-secrets.io/v1beta1
      externalSecrets.secretStoreRef.name: s
      externalSecrets.dataFrom: [{remoteKey: k}]
    asserts:
      - isAPIVersion:
          of: external-secrets.io/v1beta1
