{{- /*
[III/IV] ExternalSecret: the External Secrets Operator (ESO) reads the values
from your secret manager and writes them into a normal Kubernetes Secret
named "<fullname>-secrets", which the pod loads with envFrom. ESO re-syncs
every refreshInterval, so rotated secrets reach the cluster automatically.
*/}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "twelve-factor-app.fullname" . }}
  labels:
    {{- include "twelve-factor-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "twelve-factor-app.externalSecretTarget" . }}
    creationPolicy: Owner # the Secret is deleted together with the ExternalSecret
  {{- with .Values.externalSecrets.data }}
  data:
    {{- range . }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey | quote }}
        {{- with .property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with .version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- range . }}
    - extract:
        key: {{ .remoteKey | quote }}
    {{- end }}
  {{- end }}
{{- end }}
