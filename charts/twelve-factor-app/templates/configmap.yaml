# [III] Non-secret configuration, loaded into the pod with envFrom.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "twelve-factor-app.fullname" . }}
  labels:
    {{- include "twelve-factor-app.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config.env }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
