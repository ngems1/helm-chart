# ClusterSecretStore for AWS Secrets Manager, authenticated with IRSA / EKS Pod Identity.
# The ESO controller's ServiceAccount must be allowed to call secretsmanager:GetSecretValue
# on the secrets your apps use (scope the IAM policy to e.g. arn:aws:secretsmanager:*:*:secret:prod/*).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
