# LOCAL / CI ONLY. The "fake" provider serves hard-coded values, so you can test
# the whole ESO flow on a laptop without any cloud account. Never use it in production.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-store
spec:
  provider:
    fake:
      data:
        - key: local/orders/database
          value: postgres://orders:not-a-real-password@db.shop.svc:5432/orders
        - key: local/orders/env
          value: '{"API_TOKEN": "local-dev-token", "PAYMENT_PROVIDER": "sandbox"}'
